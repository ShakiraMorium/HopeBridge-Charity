services:
  - type: web
    name: hopebridge-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: ALLOWED_HOSTS
        value: "hopebridge-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hopebridge-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL
        value: "https://hopebridge-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: hopebridge-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "hello@hopebridge.org"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: static
    name: hopebridge-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://hopebridge-backend.onrender.com"
      - key: VITE_SIGNUP_LOTTIE_URL
        sync: false
      - key: VITE_LOGIN_LOTTIE_URL
        sync: false

databases:
  - name: hopebridge-db
    plan: free
